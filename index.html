<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Body Runner</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #07111f;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        /* =========================
           TOP BAR
        ========================== */

        .topbar {
            height: 72px;
            background: rgba(5, 12, 24, 0.95);
            border-bottom: 1px solid rgba(255,255,255,0.12);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            position: relative;
            z-index: 20;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 36px;
        }

        .logo-text {
            font-size: 25px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .score-box {
            display: flex;
            gap: 12px;
        }

        .score {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: bold;
        }

        /* =========================
           MAIN GAME AREA
        ========================== */

        .game-wrapper {
            width: 100%;
            height: calc(100vh - 72px);
            min-height: 620px;
            position: relative;
            overflow: hidden;

            background:
                linear-gradient(
                    rgba(7,17,31,0.05),
                    rgba(7,17,31,0.4)
                ),
                linear-gradient(
                    to bottom,
                    #54c8ff 0%,
                    #b7ecff 40%,
                    #8ed36b 40%,
                    #4b9a42 100%
                );
        }

        /* =========================
           SKY
        ========================== */

        .sun {
            position: absolute;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: #fff2a6;
            right: 15%;
            top: 55px;
            box-shadow: 0 0 70px rgba(255,240,150,0.8);
        }

        .cloud {
            position: absolute;
            background: rgba(255,255,255,0.8);
            width: 150px;
            height: 45px;
            border-radius: 50px;
        }

        .cloud::before,
        .cloud::after {
            content: "";
            position: absolute;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
        }

        .cloud::before {
            width: 65px;
            height: 65px;
            left: 25px;
            bottom: 15px;
        }

        .cloud::after {
            width: 75px;
            height: 75px;
            right: 20px;
            bottom: 10px;
        }

        .cloud.one {
            top: 100px;
            left: 10%;
            transform: scale(.8);
        }

        .cloud.two {
            top: 180px;
            right: 30%;
            transform: scale(.55);
        }

        /* =========================
           DISTANT CITY / MOUNTAINS
        ========================== */

        .background {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 40%;
            height: 180px;
            background:
                linear-gradient(135deg, transparent 50%, #5e9c91 50%) 0 100% / 160px 160px repeat-x;
            opacity: .65;
        }

        /* =========================
           ROAD
        ========================== */

        .road {
            position: absolute;
            left: 50%;
            bottom: -20%;
            width: 92%;
            height: 90%;
            transform: translateX(-50%);
            background:
                linear-gradient(
                    90deg,
                    #343b46 0%,
                    #222832 12%,
                    #1c222c 50%,
                    #222832 88%,
                    #343b46 100%
                );

            clip-path: polygon(
                38% 0%,
                62% 0%,
                100% 100%,
                0% 100%
            );

            box-shadow: 0 -10px 40px rgba(0,0,0,.35);
        }

        /* Road lane lines */

        .lane-line {
            position: absolute;
            bottom: -10%;
            width: 10px;
            height: 120%;
            background: rgba(255,255,255,0.75);
            transform-origin: bottom center;
            opacity: .7;
        }

        .lane-left {
            left: 44%;
            transform: rotate(8deg);
        }

        .lane-right {
            left: 56%;
            transform: rotate(-8deg);
        }

        /* Road edge */

        .road-edge-left,
        .road-edge-right {
            position: absolute;
            bottom: -10%;
            height: 110%;
            width: 12px;
            background: #f5f5f5;
        }

        .road-edge-left {
            left: 20%;
            transform: rotate(13deg);
        }

        .road-edge-right {
            right: 20%;
            transform: rotate(-13deg);
        }

        /* =========================
           PLAYER
        ========================== */

        #player {
            position: absolute;
            z-index: 8;

            left: 50%;
            bottom: 110px;

            transform: translateX(-50%);

            font-size: 90px;

            transition:
                left .22s ease,
                bottom .18s ease,
                transform .18s ease;

            filter:
                drop-shadow(0 12px 7px rgba(0,0,0,.35));
        }

        /* =========================
           OBSTACLES
        ========================== */

        .obstacle {
            position: absolute;
            z-index: 7;

            font-size: 55px;

            animation: obstacleMove 5s linear infinite;
        }

        .obstacle.one {
            left: 42%;
            top: 20%;
        }

        .obstacle.two {
            left: 55%;
            top: 5%;
            animation-delay: 2s;
        }

        @keyframes obstacleMove {
            from {
                transform: translateY(0) scale(.4);
                opacity: .2;
            }

            to {
                transform: translateY(520px) scale(1.5);
                opacity: 1;
            }
        }

        /* =========================
           COINS
        ========================== */

        .coin {
            position: absolute;
            z-index: 6;
            font-size: 38px;
            animation:
                coinMove 4s linear infinite,
                coinSpin 1s linear infinite;
        }

        .coin.one {
            left: 48%;
            top: 15%;
        }

        .coin.two {
            left: 53%;
            top: 0%;
            animation-delay: 1.5s;
        }

        @keyframes coinMove {
            from {
                transform: translateY(0) scale(.3);
            }

            to {
                transform: translateY(550px) scale(1.4);
            }
        }

        @keyframes coinSpin {
            0% {
                filter: brightness(1);
            }

            50% {
                filter: brightness(1.8);
            }

            100% {
                filter: brightness(1);
            }
        }

        /* =========================
           CAMERA BOX
        ========================== */

        .camera-panel {
            position: absolute;
            z-index: 30;

            top: 22px;
            right: 22px;

            width: 250px;

            background: rgba(5, 12, 24, 0.92);
            border: 1px solid rgba(255,255,255,0.25);

            border-radius: 16px;
            padding: 10px;

            box-shadow:
                0 15px 45px rgba(0,0,0,.4);

            backdrop-filter: blur(10px);
        }

        .camera-title {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;

            display: flex;
            justify-content: space-between;
        }

        .live {
            color: #55ff88;
        }

        #camera {
            display: block;
            width: 100%;
            height: 160px;

            object-fit: cover;

            border-radius: 10px;

            transform: scaleX(-1);

            background: #000;
        }

        #status {
            margin-top: 8px;
            font-size: 12px;
            color: #bcd0e8;
            text-align: center;
        }

        /* =========================
           START SCREEN
        ========================== */

        .start-panel {
            position: absolute;
            z-index: 25;

            left: 50%;
            top: 45%;

            transform: translate(-50%, -50%);

            text-align: center;

            background: rgba(5,12,24,.88);
            padding: 35px 50px;

            border-radius: 24px;

            border: 1px solid rgba(255,255,255,.18);

            box-shadow:
                0 20px 70px rgba(0,0,0,.45);

            backdrop-filter: blur(10px);
        }

        .start-panel h2 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .start-panel p {
            color: #cbd8e8;
            margin-bottom: 24px;
        }

        #startButton {
            border: none;

            padding: 15px 35px;

            border-radius: 12px;

            background: #ffffff;
            color: #111;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            transition: .2s;
        }

        #startButton:hover {
            transform: scale(1.05);
        }

        /* =========================
           CONTROLS
        ========================== */

        .controls {
            position: absolute;

            bottom: 25px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 15;

            display: flex;
            gap: 10px;

            background: rgba(5,12,24,.75);

            padding: 10px 16px;

            border-radius: 14px;

            font-size: 13px;

            backdrop-filter: blur(8px);
        }

        .control {
            padding: 5px 10px;
            color: #dce8f5;
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 700px) {

            .topbar {
                padding: 0 14px;
                height: 62px;
            }

            .logo-text {
                font-size: 19px;
            }

            .score {
                padding: 7px 10px;
                font-size: 12px;
            }

            .camera-panel {
                width: 150px;
                top: 12px;
                right: 12px;
            }

            #camera {
                height: 95px;
            }

            .start-panel {
                width: 88%;
                padding: 25px;
            }

            .start-panel h2 {
                font-size: 30px;
            }

            .controls {
                width: 90%;
                justify-content: center;
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- TOP BAR -->

    <header class="topbar">

        <div class="logo">
            <div class="logo-icon">🏃</div>
            <div class="logo-text">BODY RUNNER</div>
        </div>

        <div class="score-box">

            <div class="score">
                SCORE: <span id="score">000000</span>
            </div>

            <div class="score">
                🪙 <span id="coins">0</span>
            </div>

        </div>

    </header>


    <!-- GAME -->

    <main class="game-wrapper">

        <div class="sun"></div>

        <div class="cloud one"></div>
        <div class="cloud two"></div>

        <div class="background"></div>

        <!-- ROAD -->

        <div class="road"></div>

        <div class="lane-line lane-left"></div>
        <div class="lane-line lane-right"></div>

        <div class="road-edge-left"></div>
        <div class="road-edge-right"></div>


        <!-- OBSTACLES -->

        <div class="obstacle one">🚧</div>
        <div class="obstacle two">🚧</div>


        <!-- COINS -->

        <div class="coin one">🪙</div>
        <div class="coin two">🪙</div>


        <!-- PLAYER -->

        <div id="player">🏃</div>


        <!-- CAMERA -->

        <div class="camera-panel">

            <div class="camera-title">

                <span>BODY CAMERA</span>

                <span class="live">● LIVE</span>

            </div>

            <video
                id="camera"
                autoplay
                playsinline>
            </video>

            <div id="status">
                Camera not started
            </div>

        </div>


        <!-- START PANEL -->

        <div class="start-panel">

            <h2>BODY RUNNER</h2>

            <p>
                Control the runner using your body movements.
            </p>

            <button id="startButton">
                🎥 START CAMERA
            </button>

        </div>


        <!-- CONTROLS -->

        <div class="controls">

            <div class="control">
                👈 Move Left
            </div>

            <div class="control">
                👉 Move Right
            </div>

            <div class="control">
                ⬆️ Jump
            </div>

            <div class="control">
                ⬇️ Crouch
            </div>

        </div>

    </main>


    <!-- CAMERA SCRIPT -->

    <script>

        const camera = document.getElementById("camera");
        const startButton = document.getElementById("startButton");
        const status = document.getElementById("status");

        startButton.addEventListener("click", async () => {

            try {

                const stream =
                    await navigator.mediaDevices.getUserMedia({
                        video: {
                            width: {
                                ideal: 640
                            },

                            height: {
                                ideal: 480
                            }
                        },

                        audio: false
                    });

                camera.srcObject = stream;

                status.textContent =
                    "Camera is working! 🎥";

                startButton.textContent =
                    "CAMERA ACTIVE ✓";

            } catch (error) {

                status.textContent =
                    "Camera permission was denied.";

                console.error(error);

            }

        });

    </script>


    <!-- BODY POSE DETECTION -->

    <script
        type="module"
        src="pose.js">
    </script>


</body>
</html>
