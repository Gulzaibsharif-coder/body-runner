<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BODY RUNNER — Motion Game</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#07111f;
}

/* GAME */

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:
        linear-gradient(
            to bottom,
            #55c8ef 0%,
            #9be4f6 34%,
            #78b65d 35%,
            #4f9149 100%
        );
}

/* SUN */

.sun{
    position:absolute;
    width:150px;
    height:150px;
    border-radius:50%;
    background:#ffe98a;
    right:12%;
    top:8%;
    box-shadow:0 0 60px rgba(255,230,100,.8);
}

/* CLOUDS */

.cloud{
    position:absolute;
    width:150px;
    height:45px;
    border-radius:50px;
    background:rgba(255,255,255,.8);
}

.cloud:before,
.cloud:after{
    content:"";
    position:absolute;
    background:white;
    border-radius:50%;
}

.cloud:before{
    width:70px;
    height:70px;
    left:20px;
    top:-35px;
}

.cloud:after{
    width:80px;
    height:80px;
    right:15px;
    top:-40px;
}

.cloud1{
    top:12%;
    left:10%;
}

.cloud2{
    top:18%;
    right:25%;
    transform:scale(.7);
}

/* ROAD */

#road{
    position:absolute;
    bottom:-5%;
    left:50%;
    transform:translateX(-50%);

    width:72%;
    height:78%;

    background:
        linear-gradient(
            90deg,
            #222b37 0%,
            #17202c 50%,
            #222b37 100%
        );

    clip-path:polygon(
        38% 0,
        62% 0,
        100% 100%,
        0 100%
    );

    box-shadow:
        0 -20px 40px rgba(0,0,0,.2);
}

/* ROAD LANES */

.lane{
    position:absolute;
    bottom:0;
    width:8px;
    height:100%;
    background:#7c8791;
    opacity:.8;
}

.lane.left{
    left:42%;
}

.lane.right{
    right:42%;
}

/* ROAD CENTER DASHES */

.centerLine{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    width:8px;
    height:70px;
    background:#fff;
    opacity:.8;
    animation:roadMove .8s linear infinite;
}

@keyframes roadMove{

    from{
        top:-100px;
    }

    to{
        top:100%;
    }

}

/* GAME HEADER */

#header{
    position:absolute;
    top:20px;
    left:25px;
    z-index:20;

    color:white;
    text-shadow:0 3px 8px rgba(0,0,0,.5);
}

#header h1{
    margin:0;
    font-size:42px;
    letter-spacing:2px;
}

#header p{
    margin:5px 0;
    font-size:17px;
}

/* SCORE */

#scoreBox{

    position:absolute;
    top:25px;
    left:50%;
    transform:translateX(-50%);

    z-index:30;

    background:rgba(4,12,25,.85);
    color:white;

    padding:12px 28px;
    border-radius:18px;

    font-size:21px;
    font-weight:bold;

    box-shadow:0 8px 25px rgba(0,0,0,.25);
}

/* PLAYER */

#player{

    position:absolute;

    left:50%;
    bottom:20%;

    transform:
        translateX(-50%)
        scale(1);

    font-size:95px;

    z-index:10;

    transition:
        left .12s ease,
        bottom .12s ease,
        transform .12s ease;

    filter:
        drop-shadow(0 10px 5px rgba(0,0,0,.4));
}

/* PLAYER JUMP */

#player.jump{

    bottom:42%;

    transform:
        translateX(-50%)
        scale(1.08)
        rotate(-5deg);

}

/* PLAYER CROUCH */

#player.crouch{

    bottom:18%;

    transform:
        translateX(-50%)
        scale(.75, .55);

}

/* CAMERA PANEL */

#cameraPanel{

    position:absolute;

    top:18px;
    right:18px;

    width:330px;

    background:
        rgba(4,12,24,.95);

    border:
        1px solid rgba(255,255,255,.15);

    border-radius:22px;

    padding:10px;

    z-index:100;

    box-shadow:
        0 15px 45px rgba(0,0,0,.4);
}

.cameraHeader{

    display:flex;
    justify-content:space-between;
    align-items:center;

    color:white;

    font-size:15px;
    font-weight:bold;

    padding:3px 8px 9px;
}

.live{

    color:#4cff88;
}

#camera{

    width:100%;
    height:185px;

    object-fit:cover;

    border-radius:15px;

    transform:scaleX(-1);

    background:#000;
}

#status{

    text-align:center;

    color:#b9c7d8;

    font-size:14px;

    padding:8px 2px 4px;
}

/* CONTROL GUIDE */

#controls{

    position:absolute;

    bottom:25px;
    left:50%;

    transform:translateX(-50%);

    z-index:50;

    display:flex;

    gap:15px;

    background:
        rgba(4,12,25,.9);

    padding:15px 24px;

    border-radius:18px;

    color:white;

    font-size:15px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.3);
}

.control{
    white-space:nowrap;
}

/* START SCREEN */

#startScreen{

    position:absolute;

    z-index:200;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:600px;
    max-width:85vw;

    text-align:center;

    color:white;

    background:
        rgba(5,13,26,.94);

    border-radius:30px;

    padding:35px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.5);
}

#startScreen h2{

    margin:0 0 10px;

    font-size:48px;

}

#startScreen p{

    color:#cbd5e1;

    font-size:18px;

    line-height:1.5;

}

#startButton{

    margin-top:15px;

    border:none;

    padding:17px 40px;

    border-radius:14px;

    font-size:19px;

    font-weight:bold;

    cursor:pointer;

    background:white;

    color:#08111f;

    transition:.2s;

}

#startButton:hover{

    transform:scale(1.05);

}

/* MOBILE */

@media(max-width:800px){

    #header h1{
        font-size:28px;
    }

    #cameraPanel{

        width:220px;

        top:10px;
        right:10px;

    }

    #camera{

        height:125px;

    }

    #scoreBox{

        top:90px;

        font-size:16px;

    }

    #controls{

        width:95%;

        justify-content:center;

        flex-wrap:wrap;

        font-size:12px;

        bottom:10px;

    }

    #player{

        font-size:70px;

    }

}

</style>
</head>

<body>

<div id="game">

    <div class="sun"></div>

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <div id="road">

        <div class="lane left"></div>
        <div class="lane right"></div>

        <div class="centerLine"></div>

    </div>

    <!-- HEADER -->

    <div id="header">

        <h1>🏃 BODY RUNNER</h1>

        <p>
            Move your body • Move your hands • Keep running
        </p>

    </div>

    <!-- SCORE -->

    <div id="scoreBox">

        🏆 SCORE:
        <span id="score">0</span>

    </div>

    <!-- PLAYER -->

    <div id="player">

        🏃

    </div>

    <!-- CAMERA -->

    <div id="cameraPanel">

        <div class="cameraHeader">

            <span>BODY CAMERA</span>

            <span class="live">● LIVE</span>

        </div>

        <video
            id="camera"
            autoplay
            playsinline>
        </video>

        <div id="status">

            Camera waiting...

        </div>

    </div>

    <!-- CONTROLS -->

    <div id="controls">

        <div class="control">
            👈 Left
        </div>

        <div class="control">
            👉 Right
        </div>

        <div class="control">
            🙌 Jump
        </div>

        <div class="control">
            👇 Crouch
        </div>

    </div>

    <!-- START -->

    <div id="startScreen">

        <h2>BODY RUNNER</h2>

        <p>

            Control the runner using your
            <b>body AND hands</b>.

            <br><br>

            Move left or right to change lanes.
            Jump to avoid obstacles.
            Crouch to pass under barriers.

        </p>

        <button id="startButton">

            START CAMERA 🎥

        </button>

    </div>

</div>


<script>

const video =
    document.getElementById("camera");

const player =
    document.getElementById("player");

const startButton =
    document.getElementById("startButton");

const status =
    document.getElementById("status");

const startScreen =
    document.getElementById("startScreen");

const scoreElement =
    document.getElementById("score");


/* =========================
   GAME STATE
========================= */

let lane = 1;

let score = 0;

let jumping = false;

let crouching = false;

let gameStarted = false;


/*
    Lane positions

    0 = LEFT
    1 = CENTER
    2 = RIGHT
*/

const lanePositions = [
    "38%",
    "50%",
    "62%"
];


function movePlayer(){

    player.style.left =
        lanePositions[lane];

}


/* =========================
   MOVE LEFT
========================= */

function moveLeft(){

    if(lane > 0){

        lane--;

        movePlayer();

    }

}


/* =========================
   MOVE RIGHT
========================= */

function moveRight(){

    if(lane < 2){

        lane++;

        movePlayer();

    }

}


/* =========================
   JUMP
========================= */

function jump(){

    if(jumping || crouching)
        return;

    jumping = true;

    player.classList.add("jump");

    setTimeout(()=>{

        player.classList.remove("jump");

        jumping = false;

    },700);

}


/* =========================
   CROUCH
========================= */

function crouch(){

    if(jumping)
        return;

    crouching = true;

    player.classList.add("crouch");

    setTimeout(()=>{

        player.classList.remove("crouch");

        crouching = false;

    },700);

}


/* =========================
   KEYBOARD FALLBACK
========================= */

document.addEventListener(
    "keydown",
    event => {

        if(event.key === "ArrowLeft")
            moveLeft();

        if(event.key === "ArrowRight")
            moveRight();

        if(
            event.key === "ArrowUp" ||
            event.key === " "
        )
            jump();

        if(event.key === "ArrowDown")
            crouch();

    }
);


/* =========================
   SCORE
========================= */

setInterval(()=>{

    if(gameStarted){

        score++;

        scoreElement.textContent =
            score;

    }

},1000);


/* =========================
   MEDIAPIPE POSE
========================= */

let pose;

let previousBodyX = 0.5;

let bodyCooldown = 0;


/*
    Create Pose detector
*/

pose = new Pose({

    locateFile: file => {

        return `
        https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}
        `;

    }

});


pose.setOptions({

    modelComplexity:1,

    smoothLandmarks:true,

    enableSegmentation:false,

    minDetectionConfidence:.55,

    minTrackingConfidence:.55

});


pose.onResults(
    results => {

        if(!results.poseLandmarks)
            return;


        const landmarks =
            results.poseLandmarks;


        /*
            Important body landmarks

            11 = left shoulder
            12 = right shoulder
            23 = left hip
            24 = right hip
            15 = left wrist
            16 = right wrist
        */


        const leftShoulder =
            landmarks[11];

        const rightShoulder =
            landmarks[12];

        const leftHip =
            landmarks[23];

        const rightHip =
            landmarks[24];


        if(
            !leftShoulder ||
            !rightShoulder ||
            !leftHip ||
            !rightHip
        )
            return;


        /*
            BODY CENTER
        */

        const bodyX =
            (
                leftShoulder.x +
                rightShoulder.x
            ) / 2;


        /*
            BODY LEFT / RIGHT

            Large movement of the
            body controls lanes.
        */

        const difference =
            bodyX -
            previousBodyX;


        if(
            bodyCooldown <= 0
        ){

            if(difference < -0.07){

                moveLeft();

                bodyCooldown = 12;

            }

            if(difference > 0.07){

                moveRight();

                bodyCooldown = 12;

            }

        }


        if(bodyCooldown > 0)
            bodyCooldown--;


        previousBodyX =
            bodyX;


        /*
            JUMP DETECTION

            Hip moving upward means
            the person is jumping.
        */

        const hipY =
            (
                leftHip.y +
                rightHip.y
            ) / 2;


        if(
            window.previousHipY !== undefined
        ){

            const jumpMovement =
                window.previousHipY -
                hipY;


            if(
                jumpMovement > 0.055
            ){

                jump();

            }

        }


        window.previousHipY =
            hipY;


        /*
            CROUCH DETECTION

            Hips moving downward
            significantly = crouch.
        */

        if(
            window.previousHipY !== undefined
        ){

            const crouchMovement =
                hipY -
                window.lastHipY;


            if(
                crouchMovement > 0.045
            ){

                crouch();

            }

        }

        window.lastHipY =
            hipY;

    }
);


/* =========================
   HAND TRACKING
========================= */

const hands =
    new Hands({

        locateFile:file=>{

            return `
            https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}
            `;

        }

    });


hands.setOptions({

    maxNumHands:2,

    modelComplexity:1,

    minDetectionConfidence:.55,

    minTrackingConfidence:.55

});


let previousHandX =
    0.5;

let handCooldown =
    0;


/*
    HAND RESULTS
*/

hands.onResults(
    results => {

        if(
            !results.multiHandLandmarks ||
            results.multiHandLandmarks.length === 0
        )
            return;


        /*
            Use first detected hand
        */

        const hand =
            results.multiHandLandmarks[0];


        const wrist =
            hand[0];

        const index =
            hand[8];


        if(!wrist || !index)
            return;


        /*
            Hand center
        */

        const handX =
            (
                wrist.x +
                index.x
            ) / 2;


        /*
            HAND LEFT / RIGHT
        */

        const movement =
            handX -
            previousHandX;


        if(
            handCooldown <= 0
        ){

            if(
                movement < -0.09
            ){

                moveLeft();

                handCooldown =
                    14;

            }


            if(
                movement > 0.09
            ){

                moveRight();

                handCooldown =
                    14;

            }

        }


        if(handCooldown > 0)
            handCooldown--;


        previousHandX =
            handX;


        /*
            HAND JUMP

            Index finger / wrist
            above the head area.
        */

        const handY =
            wrist.y;


        if(
            handY < 0.25
        ){

            jump();

        }


    }
);


/* =========================
   CAMERA
========================= */

startButton.addEventListener(
    "click",
    async()=>{

        try{

            const stream =
                await navigator.mediaDevices.getUserMedia({

                    video:{
                        width:1280,
                        height:720,
                        facingMode:"user"
                    },

                    audio:false

                });


            video.srcObject =
                stream;


            startScreen.style.display =
                "none";


            status.innerHTML =
                "Camera is working! 🎥<br>Move your body or hands.";


            gameStarted =
                true;


            /*
                Start MediaPipe camera
            */

            const camera =
                new Camera(
                    video,
                    {

                        onFrame:
                        async()=>{

                            await pose.send({
                                image:video
                            });

                            await hands.send({
                                image:video
                            });

                        },

                        width:1280,

                        height:720

                    }
                );


            camera.start();


        }
        catch(error){

            console.error(error);

            status.textContent =
                "Camera permission denied.";

        }

    }
);

</script>

</body>
</html>
