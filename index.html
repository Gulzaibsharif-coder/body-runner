<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Body Runner - Active Motion Game</title>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#07111f;
}

body{
    color:white;
}

/* ================= HEADER ================= */

.header{
    height:72px;
    background:#07111f;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    position:relative;
    z-index:20;
    box-shadow:0 4px 15px rgba(0,0,0,.35);
}

.logo{
    display:flex;
    align-items:center;
    gap:14px;
}

.logo-icon{
    font-size:42px;
}

.logo-text{
    font-size:32px;
    font-weight:900;
    letter-spacing:2px;
}

.stats{
    display:flex;
    gap:14px;
}

.stat{
    background:#101c2c;
    border:1px solid rgba(255,255,255,.15);
    padding:11px 22px;
    border-radius:14px;
    font-size:19px;
    font-weight:bold;
}

/* ================= GAME ================= */

.game-wrapper{
    position:relative;
    width:100%;
    height:calc(100vh - 72px);
    overflow:hidden;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

/* ================= CAMERA ================= */

.camera-panel{
    position:absolute;
    top:20px;
    right:22px;
    width:300px;
    background:#07111f;
    border-radius:20px;
    padding:12px;
    z-index:10;
    box-shadow:0 10px 35px rgba(0,0,0,.45);
    border:1px solid rgba(255,255,255,.12);
}

.camera-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:bold;
    font-size:17px;
    margin-bottom:9px;
}

.live{
    color:#48ff86;
}

#camera{
    width:100%;
    height:170px;
    object-fit:cover;
    border-radius:14px;
    transform:scaleX(-1);
    background:#172438;
}

.camera-status{
    text-align:center;
    padding:8px 2px 2px;
    color:#bcd0e8;
    font-size:14px;
}

/* ================= START SCREEN ================= */

.start-screen{
    position:absolute;
    inset:0;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(3,9,17,.48);
    backdrop-filter:blur(3px);
}

.start-card{
    width:min(650px,90%);
    background:rgba(7,17,31,.95);
    border:1px solid rgba(255,255,255,.16);
    border-radius:28px;
    padding:42px;
    text-align:center;
    box-shadow:0 25px 70px rgba(0,0,0,.5);
}

.start-card h1{
    font-size:52px;
    margin:0 0 10px;
    letter-spacing:2px;
}

.start-card p{
    color:#c7d6e7;
    font-size:19px;
    line-height:1.6;
}

.controls-info{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin:25px 0;
}

.control-box{
    background:#111f32;
    padding:13px 6px;
    border-radius:12px;
    font-size:14px;
}

.start-button{
    border:0;
    border-radius:15px;
    padding:17px 42px;
    font-size:20px;
    font-weight:900;
    cursor:pointer;
    background:white;
    color:#07111f;
    transition:.2s;
}

.start-button:hover{
    transform:scale(1.05);
}

.fitness-message{
    margin-top:20px;
    color:#7dffb0;
    font-size:15px;
    line-height:1.5;
}

/* ================= GAME MESSAGE ================= */

.message{
    position:absolute;
    top:25px;
    left:50%;
    transform:translateX(-50%);
    z-index:8;
    background:rgba(7,17,31,.88);
    padding:10px 22px;
    border-radius:20px;
    font-weight:bold;
    opacity:0;
    transition:.25s;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    .header{
        height:60px;
        padding:0 12px;
    }

    .logo-text{
        font-size:20px;
    }

    .logo-icon{
        font-size:28px;
    }

    .stat{
        padding:7px 10px;
        font-size:13px;
    }

    .camera-panel{
        width:180px;
        top:10px;
        right:10px;
    }

    #camera{
        height:105px;
    }

    .camera-title{
        font-size:12px;
    }

    .camera-status{
        font-size:11px;
    }

    .start-card{
        padding:25px 18px;
    }

    .start-card h1{
        font-size:35px;
    }

    .controls-info{
        grid-template-columns:repeat(2,1fr);
    }
}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <div class="logo">
        <div class="logo-icon">🏃</div>
        <div class="logo-text">BODY RUNNER</div>
    </div>

    <div class="stats">

        <div class="stat">
            🏆 SCORE:
            <span id="score">0</span>
        </div>

        <div class="stat">
            🪙 <span id="coins">0</span>
        </div>

    </div>

</header>


<!-- ================= GAME ================= -->

<div class="game-wrapper">

    <canvas id="gameCanvas"></canvas>


    <!-- CAMERA -->

    <div class="camera-panel">

        <div class="camera-title">

            <span>BODY CAMERA</span>

            <span class="live">● LIVE</span>

        </div>

        <video
            id="camera"
            autoplay
            muted
            playsinline>
        </video>

        <div
            id="cameraStatus"
            class="camera-status">
            Camera not started
        </div>

    </div>


    <div id="message" class="message">
        Ready!
    </div>


    <!-- START SCREEN -->

    <div
        id="startScreen"
        class="start-screen">

        <div class="start-card">

            <h1>🏃 BODY RUNNER</h1>

            <p>
                Run, jump, crouch and move your hands
                to control the character.
            </p>

            <div class="controls-info">

                <div class="control-box">
                    👈<br>
                    Move Left
                </div>

                <div class="control-box">
                    👉<br>
                    Move Right
                </div>

                <div class="control-box">
                    🙌<br>
                    Jump
                </div>

                <div class="control-box">
                    🧎<br>
                    Crouch
                </div>

            </div>

            <button
                id="startButton"
                class="start-button">
                ▶ START GAME
            </button>

            <div class="fitness-message">
                💪 Move your body to play.<br>
                Less sitting. More movement. More fun.
            </div>

        </div>

    </div>

</div>


<script>

/* =========================================================
   BODY RUNNER
   Original endless runner game
   ========================================================= */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");

const cameraVideo =
    document.getElementById("camera");

const cameraStatus =
    document.getElementById("cameraStatus");

const startButton =
    document.getElementById("startButton");

const startScreen =
    document.getElementById("startScreen");

const scoreElement =
    document.getElementById("score");

const coinsElement =
    document.getElementById("coins");

const messageElement =
    document.getElementById("message");


/* ================= GAME STATE ================= */

let W = window.innerWidth;
let H = window.innerHeight - 72;

canvas.width = W;
canvas.height = H;

window.addEventListener("resize", () => {

    W = window.innerWidth;
    H = window.innerHeight - 72;

    canvas.width = W;
    canvas.height = H;

});


let gameRunning = false;

let score = 0;

let coins = 0;

let speed = 7;

let distance = 0;

let lastTime = 0;

let spawnTimer = 0;

let coinTimer = 0;

let audioStarted = false;


/* ================= PLAYER ================= */

const player = {

    lane:1,

    targetLane:1,

    x:0,

    y:0,

    width:55,

    height:100,

    jumpY:0,

    velocityY:0,

    jumping:false,

    crouching:false,

    frame:0

};


/* ================= OBJECTS ================= */

let obstacles = [];

let coinObjects = [];


/* ================= LANES ================= */

function laneX(lane){

    const center = W / 2;

    const laneWidth =
        Math.min(W * .22, 230);

    return center +
        (lane - 1) * laneWidth;

}


/* ================= CAMERA ================= */

async function startCamera(){

    try{

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    width:640,
                    height:480,
                    facingMode:"user"
                },

                audio:false

            });

        cameraVideo.srcObject = stream;

        cameraStatus.innerHTML =
            "Camera is working! 🎥<br>Move your body or hands.";

        initializePose();

        initializeHands();

    }

    catch(error){

        console.error(error);

        cameraStatus.textContent =
            "Camera unavailable. Keyboard controls still work.";

    }

}


/* ================= AUDIO ================= */

let audioContext;

function initAudio(){

    if(audioStarted) return;

    audioStarted = true;

    audioContext =
        new (window.AudioContext ||
        window.webkitAudioContext)();

}


function sound(
    frequency,
    duration,
    type="sine",
    volume=.08
){

    if(!audioContext) return;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = type;

    oscillator.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + duration
    );

    oscillator.connect(gain);

    gain.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + duration
    );

}


function jumpSound(){

    sound(420,.08,"square",.06);

    setTimeout(() => {
        sound(650,.13,"square",.05);
    },70);

}


function coinSound(){

    sound(700,.06,"sine",.06);

    setTimeout(() => {
        sound(1000,.08,"sine",.05);
    },50);

}


function crashSound(){

    sound(110,.25,"sawtooth",.09);

    setTimeout(() => {
        sound(65,.35,"sawtooth",.07);
    },120);

}


/* ================= MESSAGE ================= */

function showMessage(text){

    messageElement.textContent = text;

    messageElement.style.opacity = "1";

    setTimeout(() => {

        messageElement.style.opacity = "0";

    },1200);

}


/* ================= PLAYER MOVEMENT ================= */

function moveLeft(){

    if(!gameRunning) return;

    if(player.targetLane > 0){

        player.targetLane--;

        sound(300,.05,"square",.03);

    }

}


function moveRight(){

    if(!gameRunning) return;

    if(player.targetLane < 2){

        player.targetLane++;

        sound(350,.05,"square",.03);

    }

}


function jump(){

    if(!gameRunning) return;

    if(!player.jumping){

        player.jumping = true;

        player.velocityY = 19;

        jumpSound();

    }

}


function crouch(){

    if(!gameRunning) return;

    player.crouching = true;

    setTimeout(() => {

        player.crouching = false;

    },600);

}


/* ================= KEYBOARD ================= */

document.addEventListener("keydown", e => {

    if(e.key === "ArrowLeft" || e.key.toLowerCase()==="a"){
        moveLeft();
    }

    if(e.key === "ArrowRight" || e.key.toLowerCase()==="d"){
        moveRight();
    }

    if(e.key === "ArrowUp" ||
       e.key === " " ||
       e.key.toLowerCase()==="w"){

        jump();

    }

    if(e.key === "ArrowDown" ||
       e.key.toLowerCase()==="s"){

        crouch();

    }

});


/* =========================================================
   MEDIAPIPE POSE
   ========================================================= */

let poseDetector;

let previousPoseX = null;

let previousHipY = null;

let poseCooldown = 0;

function initializePose(){

    if(typeof Pose === "undefined"){

        console.log("Pose library unavailable");

        return;

    }

    poseDetector =
        new Pose({

            locateFile:(file)=>{

                return
                `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;

            }

        });

    poseDetector.setOptions({

        modelComplexity:1,

        smoothLandmarks:true,

        enableSegmentation:false,

        minDetectionConfidence:.55,

        minTrackingConfidence:.55

    });


    poseDetector.onResults(results => {

        if(!results.poseLandmarks) return;

        const lm =
            results.poseLandmarks;


        const leftShoulder =
            lm[11];

        const rightShoulder =
            lm[12];

        const leftHip =
            lm[23];

        const rightHip =
            lm[24];


        if(!leftShoulder ||
           !rightShoulder ||
           !leftHip ||
           !rightHip){

            return;

        }


        /* ================= BODY LEFT/RIGHT ================= */

        const bodyX =
            (leftShoulder.x +
             rightShoulder.x) / 2;


        if(previousPoseX !== null){

            const dx =
                bodyX - previousPoseX;


            if(poseCooldown <= 0){

                if(dx > .075){

                    moveRight();

                    poseCooldown = 15;

                }

                else if(dx < -.075){

                    moveLeft();

                    poseCooldown = 15;

                }

            }

        }


        previousPoseX = bodyX;


        /* ================= JUMP DETECTION ================= */

        const hipY =
            (leftHip.y +
             rightHip.y) / 2;


        if(previousHipY !== null){

            const movement =
                previousHipY - hipY;


            if(movement > .055){

                jump();

            }

        }


        previousHipY = hipY;


    });


    /* Process camera frames */

    async function processPose(){

        if(cameraVideo.readyState >= 2){

            await poseDetector.send({
                image:cameraVideo
            });

        }

        requestAnimationFrame(processPose);

    }

    processPose();

}


/* =========================================================
   MEDIAPIPE HANDS
   ========================================================= */

let handsDetector;

let previousHandX = null;

let handCooldown = 0;

function initializeHands(){

    if(typeof Hands === "undefined"){

        console.log("Hands library unavailable");

        return;

    }


    handsDetector =
        new Hands({

            locateFile:(file)=>{

                return
                `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

            }

        });


    handsDetector.setOptions({

        maxNumHands:2,

        modelComplexity:1,

        minDetectionConfidence:.55,

        minTrackingConfidence:.55

    });


    handsDetector.onResults(results => {

        if(!results.multiHandLandmarks ||
           results.multiHandLandmarks.length===0){

            return;

        }


        const hand =
            results.multiHandLandmarks[0];


        const wrist =
            hand[0];


        if(!wrist) return;


        const x = wrist.x;

        const y = wrist.y;


        /* ================= HAND LEFT/RIGHT ================= */

        if(previousHandX !== null &&
           handCooldown <= 0){

            const dx =
                x - previousHandX;


            if(dx > .12){

                moveRight();

                handCooldown = 18;

            }

            else if(dx < -.12){

                moveLeft();

                handCooldown = 18;

            }

        }


        previousHandX = x;


        /* ================= HAND ABOVE HEAD = JUMP ================= */

        if(y < .22){

            jump();

        }

    });


    async function processHands(){

        if(cameraVideo.readyState >= 2){

            await handsDetector.send({
                image:cameraVideo
            });

        }

        requestAnimationFrame(processHands);

    }

    processHands();

}


/* ================= OBJECT CREATION ================= */

function createObstacle(){

    const lane =
        Math.floor(Math.random()*3);

    const type =
        Math.random() > .7
        ? "barrier"
        : "block";


    obstacles.push({

        lane:lane,

        z:1,

        type:type,

        width:80,

        height:type==="barrier"?45:75

    });

}


function createCoin(){

    const lane =
        Math.floor(Math.random()*3);

    coinObjects.push({

        lane:lane,

        z:1,

        collected:false

    });

}


/* ================= DRAW SKY ================= */

function drawBackground(){

    const sky =
        ctx.createLinearGradient(
            0,0,0,H*.55
        );

    sky.addColorStop(0,"#43c6ef");

    sky.addColorStop(1,"#c8f4ff");

    ctx.fillStyle=sky;

    ctx.fillRect(0,0,W,H);


    /* Sun */

    ctx.fillStyle="#fff3a3";

    ctx.beginPath();

    ctx.arc(
        W*.78,
        H*.18,
        65,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* Clouds */

    drawCloud(W*.16,H*.16,1);

    drawCloud(W*.78,H*.12,.75);


    /* Grass */

    ctx.fillStyle="#55a84f";

    ctx.fillRect(
        0,
        H*.43,
        W,
        H*.57
    );

}


/* ================= CLOUD ================= */

function drawCloud(x,y,s){

    ctx.fillStyle="rgba(255,255,255,.9)";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        35*s,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+40*s,
        y-15*s,
        45*s,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+85*s,
        y,
        32*s,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* ================= ROAD ================= */

function drawRoad(){

    const horizonY =
        H*.40;

    const bottomY =
        H;

    const roadTopWidth =
        W*.20;

    const roadBottomWidth =
        W*.82;


    ctx.fillStyle="#1a2431";

    ctx.beginPath();

    ctx.moveTo(
        W/2-roadTopWidth/2,
        horizonY
    );

    ctx.lineTo(
        W/2+roadTopWidth/2,
        horizonY
    );

    ctx.lineTo(
        W/2+roadBottomWidth/2,
        bottomY
    );

    ctx.lineTo(
        W/2-roadBottomWidth/2,
        bottomY
    );

    ctx.closePath();

    ctx.fill();


    /* Road edges */

    ctx.strokeStyle="#e9eef2";

    ctx.lineWidth=8;

    ctx.beginPath();

    ctx.moveTo(
        W/2-roadTopWidth/2,
        horizonY
    );

    ctx.lineTo(
        W/2-roadBottomWidth/2,
        bottomY
    );

    ctx.moveTo(
        W/2+roadTopWidth/2,
        horizonY
    );

    ctx.lineTo(
        W/2+roadBottomWidth/2,
        bottomY
    );

    ctx.stroke();


    /* Lane markings */

    for(let lane=1;lane<=2;lane++){

        const topX =
            W/2 +
            (lane-1.5) *
            roadTopWidth/3;

        const bottomX =
            W/2 +
            (lane-1.5) *
            roadBottomWidth/3;


        ctx.strokeStyle="rgba(255,255,255,.45)";

        ctx.lineWidth=5;

        ctx.setLineDash([35,35]);

        ctx.beginPath();

        ctx.moveTo(
            topX,
            horizonY
        );

        ctx.lineTo(
            bottomX,
            bottomY
        );

        ctx.stroke();

        ctx.setLineDash([]);

    }

}


/* ================= TREES ================= */

function drawTrees(){

    const horizon =
        H*.41;

    for(let i=0;i<7;i++){

        const side =
            i%2===0 ? -1 : 1;

        const x =
            W/2 +
            side *
            (W*.42 + i*55);

        const y =
            horizon +
            i*35;

        const size =
            35+i*8;


        ctx.fillStyle="#633c25";

        ctx.fillRect(
            x-6,
            y,
            12,
            size
        );


        ctx.fillStyle="#27733d";

        ctx.beginPath();

        ctx.arc(
            x,
            y-15,
            size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* ================= CHARACTER ================= */

function drawPlayer(){

    const targetX =
        laneX(player.targetLane);

    player.x +=
        (targetX-player.x)*.18;


    const baseY =
        H*.79;

    const jumpOffset =
        player.jumpY;


    const x =
        player.x;

    const y =
        baseY-jumpOffset;


    ctx.save();

    ctx.translate(x,y);


    /* Shadow */

    ctx.fillStyle="rgba(0,0,0,.28)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        50+jumpOffset*.2,
        34,
        9,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* Character body */

    const crouch =
        player.crouching;


    const bodyY =
        crouch ? 10 : -15;


    /* Legs */

    ctx.strokeStyle="#17202c";

    ctx.lineWidth=12;

    ctx.lineCap="round";


    if(!crouch){

        ctx.beginPath();

        ctx.moveTo(
            -8,
            15
        );

        ctx.lineTo(
            -22,
            52
        );

        ctx.moveTo(
            8,
            15
        );

        ctx.lineTo(
            25,
            48
        );

        ctx.stroke();

    }


    /* Shoes */

    ctx.strokeStyle="#f7d046";

    ctx.lineWidth=9;

    ctx.beginPath();

    ctx.moveTo(-22,52);

    ctx.lineTo(-34,52);

    ctx.moveTo(25,48);

    ctx.lineTo(37,48);

    ctx.stroke();


    /* Body */

    ctx.fillStyle="#ff6b35";

    ctx.beginPath();

    ctx.roundRect(
        -20,
        bodyY,
        40,
        55,
        12
    );

    ctx.fill();


    /* Arms */

    ctx.strokeStyle="#ffb53d";

    ctx.lineWidth=11;

    ctx.beginPath();

    ctx.moveTo(
        -17,
        bodyY+12
    );

    ctx.lineTo(
        -38,
        bodyY+35
    );

    ctx.moveTo(
        17,
        bodyY+12
    );

    ctx.lineTo(
        39,
        bodyY+25
    );

    ctx.stroke();


    /* Head */

    ctx.fillStyle="#ffbd62";

    ctx.beginPath();

    ctx.arc(
        0,
        bodyY-17,
        20,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* Hair */

    ctx.fillStyle="#26303c";

    ctx.beginPath();

    ctx.arc(
        0,
        bodyY-23,
        20,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();


    /* Face */

    ctx.fillStyle="#17202c";

    ctx.beginPath();

    ctx.arc(
        7,
        bodyY-18,
        2,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();

}


/* ================= DRAW OBSTACLES ================= */

function drawObstacle(obj){

    const depth =
        1-obj.z;

    const scale =
        .35 + depth*1.35;


    const x =
        laneX(obj.lane);

    const y =
        H*.40 +
        depth*H*.43;


    const width =
        obj.width*scale;

    const height =
        obj.height*scale;


    ctx.save();

    ctx.translate(x,y);


    if(obj.type==="barrier"){

        ctx.fillStyle="#f3b31b";

        ctx.fillRect(
            -width/2,
            -height,
            width,
            height
        );


        ctx.fillStyle="#202938";

        for(let i=-2;i<3;i++){

            ctx.save();

            ctx.translate(i*20*scale,0);

            ctx.rotate(-.55);

            ctx.fillRect(
                -6*scale,
                -height,
                12*scale,
                height
            );

            ctx.restore();

        }

    }

    else{

        ctx.fillStyle="#e34d4d";

        ctx.fillRect(
            -width/2,
            -height,
            width,
            height
        );


        ctx.fillStyle="#fff";

        ctx.fillRect(
            -width*.38,
            -height*.65,
            width*.76,
            8*scale
        );

    }


    ctx.restore();

}


/* ================= DRAW COIN ================= */

function drawCoin(obj){

    const depth =
        1-obj.z;

    const scale =
        .35+depth*1.4;


    const x =
        laneX(obj.lane);

    const y =
        H*.43+
        depth*H*.40;


    ctx.save();

    ctx.translate(x,y);

    ctx.scale(scale,scale);


    ctx.fillStyle="#ffd23f";

    ctx.beginPath();

    ctx.arc(
        0,
        -30,
        17,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.strokeStyle="#fff0a0";

    ctx.lineWidth=4;

    ctx.stroke();


    ctx.fillStyle="#a76b00";

    ctx.font="bold 18px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        "$",
        0,
        -24
    );


    ctx.restore();

}


/* ================= COLLISION ================= */

function checkCollisions(){

    const playerLane =
        Math.round(
            player.targetLane
        );


    obstacles.forEach(obj => {

        if(obj.lane !== playerLane)
            return;


        if(obj.z < .17 &&
           obj.z > -.03){

            const jumpingHigh =
                player.jumpY > 90;

            if(jumpingHigh)
                return;


            if(
                obj.type==="barrier" &&
                player.crouching
            )
                return;


            crashSound();

            gameOver();

        }

    });


    coinObjects.forEach(obj => {

        if(obj.collected)
            return;


        if(
            obj.lane===playerLane &&
            obj.z < .13 &&
            obj.z > -.04
        ){

            obj.collected=true;

            coins++;

            score+=50;

            coinsElement.textContent =
                coins;

            scoreElement.textContent =
                score;

            coinSound();

            showMessage("🪙 +50");

        }

    });

}


/* ================= GAME OVER ================= */

function gameOver(){

    gameRunning=false;

    showMessage(
        "💥 Game Over — Press START to run again"
    );

    startButton.textContent =
        "▶ PLAY AGAIN";

    startScreen.style.display =
        "flex";

}


/* ================= UPDATE ================= */

function update(delta){

    if(!gameRunning)
        return;


    /* Player lane */

    player.lane +=
        (player.targetLane-player.lane)*.15;


    /* Jump */

    if(player.jumping){

        player.jumpY +=
            player.velocityY;

        player.velocityY -=
            1.1;


        if(player.jumpY<=0){

            player.jumpY=0;

            player.velocityY=0;

            player.jumping=false;

        }

    }


    /* Speed */

    speed +=
        delta*.00035;

    speed =
        Math.min(speed,16);


    /* Distance */

    distance += speed;


    if(distance % 10 < 1){

        score++;

        scoreElement.textContent =
            score;

    }


    /* Obstacles */

    spawnTimer += delta;

    if(spawnTimer > Math.max(550,1000-speed*25)){

        createObstacle();

        spawnTimer=0;

    }


    /* Coins */

    coinTimer += delta;

    if(coinTimer > 700){

        createCoin();

        coinTimer=0;

    }


    /* Move obstacles */

    obstacles.forEach(obj => {

        obj.z -=
            .0035 * speed;

    });


    coinObjects.forEach(obj => {

        obj.z -=
            .0035 * speed;

    });


    obstacles =
        obstacles.filter(
            obj => obj.z > -.2
        );


    coinObjects =
        coinObjects.filter(
            obj => obj.z > -.2 &&
                   !obj.collected
        );


    checkCollisions();


    if(poseCooldown>0)
        poseCooldown--;

    if(handCooldown>0)
        handCooldown--;

}


/* ================= DRAW ================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawBackground();

    drawTrees();

    drawRoad();


    /* Objects */

    const objects =
        [
            ...obstacles.map(
                o=>({type:"obstacle",data:o})
            ),

            ...coinObjects.map(
                o=>({type:"coin",data:o})
            )
        ]
        .sort(
            (a,b)=>
            b.data.z-a.data.z
        );


    objects.forEach(item => {

        if(item.type==="obstacle")
            drawObstacle(item.data);

        else
            drawCoin(item.data);

    });


    drawPlayer();

}


/* ================= GAME LOOP ================= */

function gameLoop(timestamp){

    const delta =
        timestamp-lastTime;

    lastTime=timestamp;

    update(delta);

    draw();

    requestAnimationFrame(
        gameLoop
    );

}


/* ================= START GAME ================= */

startButton.addEventListener(
    "click",
    async () => {

        initAudio();

        await startCamera();

        score=0;

        coins=0;

        speed=7;

        distance=0;

        obstacles=[];

        coinObjects=[];

        player.targetLane=1;

        player.lane=1;

        player.jumpY=0;

        player.jumping=false;

        player.crouching=false;

        scoreElement.textContent=0;

        coinsElement.textContent=0;

        gameRunning=true;

        startScreen.style.display="none";

        showMessage(
            "🏃 RUN! Move your body!"
        );

    }
);


/* ================= INITIAL DRAW ================= */

player.x =
    laneX(1);

draw();

requestAnimationFrame(
    gameLoop
);

</script>
